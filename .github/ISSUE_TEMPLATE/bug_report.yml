name: Reportar um bug
description: Algo no portal não se comporta como deveria
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pelo relato. Se for uma **falha de segurança**, não abra issue
        aqui — siga o [SECURITY.md](https://github.com/joaofelipe-dev/easyopendocs/blob/main/SECURITY.md) e use o canal
        privado.

  - type: textarea
    id: o-que-acontece
    attributes:
      label: O que acontece
      description: E o que você esperava que acontecesse.
      placeholder: |
        Ao salvar uma documentação com tabela, a tabela some da versão gravada.
        Esperava que a tabela fosse preservada, como aparece na prévia.
    validations:
      required: true

  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      description: Os passos mínimos para chegar no problema.
      placeholder: |
        1. Entrar como um usuário com `document:create` em um departamento
        2. Abrir "Nova documentação"
        3. Inserir uma tabela pelo botão da barra de ferramentas
        4. Salvar e reabrir o documento
    validations:
      required: true

  - type: dropdown
    id: papel
    attributes:
      label: Com qual acesso
      description: O papel importa — boa parte do comportamento é permissionada.
      options:
        - Super admin
        - Department Admin
        - Editor
        - Viewer
        - Sem papel no departamento
        - Não autenticado
        - Não sei / não se aplica
    validations:
      required: true

  - type: textarea
    id: ambiente
    attributes:
      label: Ambiente
      description: |
        Cole a saída de `node -v` e `npm ls next prisma`, e diga qual commit ou
        versão você está rodando (`git rev-parse --short HEAD`).
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Erros no console ou no servidor
      description: Se houver. Cole o texto, não um print.
      render: shell
    validations:
      required: false
